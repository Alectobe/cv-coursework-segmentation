# Модификация 2 (функция потерь): Dice + Focal вместо BCE, архитектура исходная.
experiment:
  name: dice_focal
  description: >-
    Модификация 2: исходный U-Net, функция потерь Dice + Focal (gamma=2)
    вместо BCE. Цель: ослабить доминирование пикселей фона (полип в среднем
    занимает ~11% кадра) и сфокусировать обучение на границах и сложных пикселях.
  tags: [dice_focal, unet, resnet34]

data:
  root: data/raw/Kvasir-SEG
  splits_dir: data/splits
  image_size: 352
  num_workers: 4

model:
  encoder_name: resnet34
  encoder_weights: imagenet
  decoder_channels: [256, 128, 64, 32, 16]
  attention_gates: false
  aspp: false

loss:
  name: dice_focal
  dice_weight: 1.0
  focal_weight: 1.0
  focal_gamma: 2.0

train:
  seed: 42
  epochs: 50
  batch_size: 8
  lr: 0.0001
  weight_decay: 0.0001
  min_lr_ratio: 0.01
  amp: true
  threshold: 0.5

tracker:
  project: Kvasir-SEG polyp segmentation

output:
  dir: artifacts/experiments
